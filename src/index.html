<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spots photo sharing website" />
    <meta name="author" content="TT Spots Project" />
    <meta name="keywords" content="HTML, CSS, Flexbox, JavaScript, Webpack" />
    <title>Spots</title>
  </head>

  <body>
    <div class="page">
      <header class="header page__section">
        <img class="header__logo" alt="Spots logo" />
      </header>

      <main class="content page__section">
        <section class="profile">
          <button
            type="button"
            class="profile__avatar-btn"
            aria-label="Edit avatar"
          >
            <img class="profile__avatar" alt="Profile avatar" />
            <span class="profile__avatar-overlay">
              <img class="profile__avatar-edit-icon" alt="Edit avatar icon" />
            </span>
          </button>

          <div class="profile__column">
            <h1 class="profile__name"></h1>

            <p class="profile__description"></p>

            <button type="button" class="profile__edit-btn">
              <img class="profile__edit-icon" alt="Edit profile icon" />
              Edit Profile
            </button>
          </div>

          <button type="button" class="profile__new-post-btn">
            <img class="profile__new-post-icon" alt="New post icon" />
            New Post
          </button>
        </section>

        <section class="cards">
          <ul class="cards__list"></ul>
        </section>

        <template id="card-template">
          <li class="card">
            <button
              type="button"
              class="card__delete-btn"
              aria-label="Delete card"
            ></button>

            <img class="card__image" alt="" />

            <div class="card__content">
              <h2 class="card__title"></h2>

              <button
                type="button"
                class="card__like-btn"
                aria-label="Like card"
              ></button>
            </div>
          </li>
        </template>
      </main>

      <footer class="footer page__section">
        <p class="footer__copyright">2026 © Spots</p>
      </footer>

      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          >
            X
          </button>

          <h2 class="modal__title">Edit profile</h2>

          <form class="modal__form" novalidate>
            <label class="modal__label">
              Name

              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                required
                minlength="2"
                maxlength="40"
              />

              <span class="modal__error" id="profile-name-input-error"></span>
            </label>

            <label class="modal__label">
              Description

              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                required
                minlength="2"
                maxlength="200"
              />

              <span
                class="modal__error"
                id="profile-description-input-error"
              ></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          >
            X
          </button>

          <h2 class="modal__title">New post</h2>

          <form class="modal__form" novalidate>
            <label class="modal__label">
              Image link

              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                required
              />

              <span class="modal__error" id="card-image-input-error"></span>
            </label>

            <label class="modal__label">
              Caption

              <input
                id="post-caption-input"
                type="text"
                class="modal__input"
                required
                minlength="2"
                maxlength="30"
              />

              <span class="modal__error" id="post-caption-input-error"></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="edit-avatar-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          >
            X
          </button>

          <h2 class="modal__title">Edit avatar</h2>

          <form class="modal__form" novalidate>
            <label class="modal__label">
              Avatar link

              <input
                id="profile-avatar-input"
                type="url"
                class="modal__input"
                required
              />

              <span class="modal__error" id="profile-avatar-input-error"></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="delete-card-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          >
            X
          </button>

          <h2 class="modal__title">Are you sure?</h2>

          <form class="modal__form" novalidate>
            <button type="submit" class="modal__submit-btn">Delete</button>
          </form>
        </div>
      </div>

      <div class="modal modal_type_image" id="image-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn"
            aria-label="Close modal"
          >
            X
          </button>

          <img class="modal__image" alt="Preview image" />

          <p class="modal__caption"></p>
        </div>
      </div>
    </div>
  </body>
</html>
